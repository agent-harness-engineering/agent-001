<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent-001</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0f1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #0d1525;
            padding: 10px 16px;
            border-bottom: 1px solid #1e3a5f;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #60a5fa;
            cursor: pointer;
            user-select: none;
            transition: color 0.15s;
        }
        header h1:hover {
            color: #93c5fd;
        }
        header h1:active {
            color: #3b82f6;
        }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%; background: #888;
        }
        .status-dot.connected {
            background: #4ade80;
            box-shadow: 0 0 6px #4ade80;
            animation: glow 2s ease-in-out infinite alternate;
        }
        .status-dot.error { background: #f87171; box-shadow: 0 0 6px #f87171; }
        @keyframes glow {
            from { box-shadow: 0 0 4px #4ade80; }
            to { box-shadow: 0 0 10px #4ade80; }
        }
        .model-badge {
            font-size: 11px;
            color: #888;
            margin-left: auto;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: #1e3a5f;
            color: #e0e0e0;
            border-bottom-right-radius: 4px;
        }
        .msg.assistant {
            align-self: flex-start;
            background: #1a1a2e;
            color: #d0d0d0;
            border-bottom-left-radius: 4px;
            border: 1px solid #2a2a4a;
            position: relative;
        }
        .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #2a2a4a;
            border: 1px solid #3a3a5a;
            color: #888;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.15s;
        }
        .msg.assistant:hover .copy-btn { opacity: 1; }
        .copy-btn:hover { background: #3a3a5a; color: #ccc; }
        .copy-btn.copied { color: #4ade80; }
        .msg.assistant p { margin-bottom: 8px; }
        .msg.assistant p:last-child { margin-bottom: 0; }
        .msg.assistant pre {
            background: #0d0d1a;
            padding: 8px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
            margin: 6px 0;
        }
        .msg.assistant code {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 13px;
        }
        .msg.error {
            align-self: center;
            background: #3b1111;
            color: #f87171;
            border: 1px solid #7f1d1d;
            font-size: 13px;
        }
        .typing {
            align-self: flex-start;
            color: #666;
            font-size: 13px;
            padding: 8px 14px;
        }
        .typing::after {
            content: '...';
            animation: dots 1.2s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        #input-bar {
            padding: 12px 16px;
            background: #0d1525;
            border-top: 1px solid #1e3a5f;
            display: flex;
            gap: 8px;
        }
        #input-bar textarea {
            flex: 1;
            background: #111827;
            border: 1px solid #1e3a5f;
            border-radius: 8px;
            color: #e0e0e0;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 42px;
            max-height: 120px;
        }
        #input-bar textarea:focus { border-color: #60a5fa; }
        #input-bar textarea::placeholder { color: #555; }
        #input-bar button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        #input-bar button:hover { background: #3b82f6; }
        #input-bar button:disabled { background: #333; color: #666; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <div class="status-dot" id="status-dot"></div>
        <h1 onclick="hardReload()" title="Click to reload (clear cache)">Agent-001</h1>
        <span class="model-badge" id="model-badge">connecting...</span>
    </header>
    <div id="messages"></div>
    <div id="input-bar">
        <textarea id="input" placeholder="Send a message..." rows="1"></textarea>
        <button id="send" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const statusDot = document.getElementById('status-dot');
        const modelBadge = document.getElementById('model-badge');

        let conversationHistory = [];

        // Auto-resize textarea
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
        });

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            if (role === 'assistant') {
                div.innerHTML = marked.parse(content);
                div.dataset.raw = content;
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = 'Copy';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(content).then(() => {
                        copyBtn.textContent = 'Copied';
                        copyBtn.classList.add('copied');
                        setTimeout(() => {
                            copyBtn.textContent = 'Copy';
                            copyBtn.classList.remove('copied');
                        }, 1500);
                    });
                };
                div.appendChild(copyBtn);
            } else {
                div.textContent = content;
            }
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing';
            div.id = 'typing-indicator';
            div.textContent = 'Thinking';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;

            addMessage('user', text);
            conversationHistory.push({ role: 'user', content: text });
            showTyping();

            try {
                const resp = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        history: conversationHistory.slice(-20)
                    }),
                });
                hideTyping();

                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({ error: resp.statusText }));
                    addMessage('error', err.error || 'Request failed');
                } else {
                    const data = await resp.json();
                    const reply = data.response || '(empty response)';
                    addMessage('assistant', reply);
                    conversationHistory.push({ role: 'assistant', content: reply });
                }
            } catch (e) {
                hideTyping();
                addMessage('error', 'Connection error: ' + e.message);
            }

            sendBtn.disabled = false;
            inputEl.focus();
        }

        async function checkStatus() {
            try {
                const resp = await fetch('/status');
                const data = await resp.json();
                statusDot.className = 'status-dot connected';
                const endpoints = Object.keys(data.endpoints || {});
                if (endpoints.length > 0) {
                    const ep = data.endpoints[endpoints[0]];
                    modelBadge.textContent = ep.model || endpoints[0];
                } else {
                    modelBadge.textContent = 'no model registered';
                    statusDot.className = 'status-dot error';
                }
            } catch {
                statusDot.className = 'status-dot error';
                modelBadge.textContent = 'offline';
            }
        }

        function hardReload() {
            if ('caches' in window) {
                caches.keys().then(names => names.forEach(n => caches.delete(n)));
            }
            location.reload(true);
        }

        checkStatus();
        setInterval(checkStatus, 30000);
        inputEl.focus();
    </script>
</body>
</html>
